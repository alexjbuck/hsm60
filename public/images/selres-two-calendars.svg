<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" font-family="Oswald, 'Arial Narrow', sans-serif" role="img" aria-labelledby="t">
  <title id="t">Fiscal years and anniversary years don't line up. AT done in October 2025 and September 2027 satisfies both fiscal years, but the May 2026 to May 2027 anniversary year gets no AT.</title>
  <rect width="480" height="220" fill="#101820"/>

  <!-- Fiscal year row -->
  <text x="20" y="26" fill="#d7a22a" font-size="16" letter-spacing="1.5">FISCAL YEAR</text>
  <text x="460" y="26" fill="#9aa8b1" font-size="14" text-anchor="end">drills · AT · flight hours</text>
  <rect x="20" y="56" width="218" height="40" fill="#006778"/>
  <rect x="242" y="56" width="218" height="40" fill="#006778"/>
  <text x="140" y="82" fill="#fff" font-size="18" text-anchor="middle">FY26</text>
  <text x="351" y="82" fill="#fff" font-size="18" text-anchor="middle">FY27</text>
  <rect x="26" y="56" width="16" height="40" fill="#d7a22a"/>
  <rect x="438" y="56" width="16" height="40" fill="#d7a22a"/>
  <text x="34" y="49" fill="#d7a22a" font-size="14" text-anchor="middle">AT</text>
  <text x="446" y="49" fill="#d7a22a" font-size="14" text-anchor="middle">AT</text>

  <!-- Anniversary year row -->
  <text x="20" y="130" fill="#d7a22a" font-size="16" letter-spacing="1.5">YOUR ANNIVERSARY YEAR</text>
  <text x="460" y="130" fill="#9aa8b1" font-size="14" text-anchor="end">retirement points</text>
  <rect x="20" y="140" width="126" height="40" fill="#006778" opacity=".45"/>
  <rect x="151" y="141" width="215" height="38" fill="#d7a22a" fill-opacity=".15" stroke="#d7a22a" stroke-width="2"/>
  <rect x="371" y="140" width="89" height="40" fill="#006778" opacity=".45"/>
  <text x="258" y="166" fill="#d7a22a" font-size="16" text-anchor="middle" letter-spacing="1">NO AT THIS YEAR</text>

  <!-- Guides where the anniversary year turns over -->
  <g stroke="#9aa8b1" stroke-dasharray="3 3" opacity=".6">
    <line x1="148.5" y1="56" x2="148.5" y2="186"/>
    <line x1="368.5" y1="56" x2="368.5" y2="186"/>
  </g>
  <g fill="#9aa8b1" font-size="14">
    <text x="20" y="206">OCT 25</text>
    <text x="148.5" y="206" text-anchor="middle">MAY 26</text>
    <text x="240" y="206" text-anchor="middle">OCT 26</text>
    <text x="368.5" y="206" text-anchor="middle">MAY 27</text>
    <text x="460" y="206" text-anchor="end">SEP 27</text>
  </g>
</svg>
